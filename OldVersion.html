<!DOCTYPE html>
<html lang="hi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0c0b0d" />
  <title>Saath — simple dating</title>
  <style>
:root {
  --bg: #0c0b0d;
  --card: #17151a;
  --elev: #221f26;
  --line: #2e2a33;
  --text: #f6f1ea;
  --muted: #a39aa8;
  --accent: #e25b6a;
  --accent-2: #f0a36b;
  --ok: #6dcf9a;
  --danger: #ff6b6b;
  --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
  font-family: "Segoe UI", "Noto Sans", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; display: block; }

.app {
  min-height: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 18px 16px 28px;
}

.brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.logo {
  font-weight: 750;
  letter-spacing: -0.04em;
  font-size: 1.35rem;
}
.logo span { color: var(--accent); }
.muted { color: var(--muted); font-size: 0.92rem; line-height: 1.45; }
.tiny { color: var(--muted); font-size: 0.78rem; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 18px;
  box-shadow: var(--shadow);
}

h1, h2 { margin: 0 0 8px; letter-spacing: -0.03em; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.2rem; }

label { display: block; margin: 12px 0 6px; font-size: 0.82rem; color: var(--muted); }
input, textarea, select {
  width: 100%;
  background: var(--elev);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 13px;
  outline: none;
}
textarea { min-height: 90px; resize: vertical; }
input:focus, textarea:focus, select:focus { border-color: #6a4a52; }

.row { display: flex; gap: 10px; }
.row > * { flex: 1; }

.btn {
  border: 0;
  border-radius: 999px;
  padding: 12px 16px;
  background: linear-gradient(135deg, var(--accent), #c44762);
  color: white;
  font-weight: 700;
  width: 100%;
  margin-top: 14px;
}
.btn.ghost {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--text);
}
.btn.ok { background: #2f6d52; }
.btn.pass { background: var(--elev); border: 1px solid var(--line); }
.btn:disabled { opacity: 0.55; }

.tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 8px 0 16px;
}
.tab {
  background: var(--elev);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 6px;
  color: var(--muted);
}
.tab.active { color: white; border-color: #6d3d48; background: #2a1c22; }

.person {
  border-radius: 26px;
  overflow: hidden;
  background: var(--elev);
  border: 1px solid var(--line);
  min-height: 420px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  position: relative;
}
.avatar {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 5rem;
  font-weight: 750;
  background:
    radial-gradient(circle at 30% 20%, rgba(226, 91, 106, 0.45), transparent 40%),
    linear-gradient(160deg, #3a2430, #17151a 70%);
}
.person .meta {
  position: relative;
  padding: 16px;
  background: linear-gradient(transparent, rgba(8, 7, 9, 0.92) 30%);
}
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip {
  font-size: 0.75rem;
  padding: 4px 8px;
  border-radius: 999px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.08);
}
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }

.list { display: flex; flex-direction: column; gap: 10px; }
.item {
  display: flex;
  gap: 12px;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 12px;
  text-align: left;
  width: 100%;
}
.dot {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #3a2430;
  font-weight: 750;
  flex: none;
}
.grow { flex: 1; min-width: 0; }
.item strong, .item span { display: block; }
.item span { color: var(--muted); font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.chat-log {
  height: 52vh;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 4px 0 10px;
}
.bubble {
  max-width: 80%;
  padding: 10px 12px;
  border-radius: 16px;
  background: var(--elev);
  border: 1px solid var(--line);
}
.bubble.mine { margin-left: auto; background: #4a2430; }

.banner {
  background: #2a2118;
  border: 1px solid #5c4630;
  color: #f0d7b8;
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 12px;
  font-size: 0.88rem;
}
.error { color: #ffb4b4; font-size: 0.86rem; min-height: 1.1em; margin-top: 8px; }
.hidden { display: none !important; }
.empty { text-align: center; padding: 28px 10px; color: var(--muted); }
.topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--elev);
}


/* Single-file UI additions */
:root[data-theme="light"] {
  --bg:#f7f3f5; --card:#ffffff; --elev:#f1eaf0; --line:#e6dce4;
  --text:#28212a; --muted:#796d79; --shadow:0 14px 34px rgba(64,35,55,.10);
}
:root[data-theme="light"] .tab.active { color:#702d4a; background:#f8e8ef; border-color:#e7b8ca; }
:root[data-theme="light"] .person .meta { background:linear-gradient(transparent,rgba(20,12,18,.88) 30%); color:#fff; }
:root[data-theme="light"] .bubble.mine { background:#f7dce7; color:#39202b; }
:root[data-theme="light"] .dot { background:#f2dce6; color:#71384f; }
.brand { gap:10px; }
.brand .brand-actions { display:flex; gap:8px; align-items:center; }
.profile-heading { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.edit-pencil { font-size:1.15rem; color:var(--accent); }
.modal-backdrop { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:18px; background:rgba(0,0,0,.68); backdrop-filter:blur(7px); }
.modal-card { width:min(100%,480px); max-height:90dvh; overflow:auto; }
.modal-heading { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding:0 2px; }
.modal-card .card { box-shadow:0 24px 70px rgba(0,0,0,.35); }
.form-actions { align-items:center; }
.form-actions .btn { flex:1; }
.chat-form { align-items:center; gap:8px; }
.chat-form input { min-width:0; flex:1 1 auto; }
.chat-form .chat-send { flex:0 0 auto; width:auto; min-width:72px; padding:11px 17px; margin:0; }
.matches-list { gap:0; }
.matches-list .item { border:0; border-bottom:1px solid var(--line); border-radius:0; background:transparent; padding:14px 4px; }
.matches-list .item:last-child { border-bottom:0; }
@media (min-width:600px) { .app { max-width:560px; } }
  </style>
</head>
<body>
  <main class="app" id="app">
    <header class="brand">
      <div class="logo">Saa<span>th</span></div>
      <div class="brand-actions">
        <button class="icon-btn" id="themeBtn" type="button" title="Toggle theme" aria-label="Toggle theme">☀</button>
        <button class="icon-btn hidden" id="logoutBtn" type="button" title="Logout">⎋</button>
      </div>
    </header>
    <div id="configBanner" class="banner hidden">Firebase configuration check karein.</div>
    <section id="screen"></section>
  </main>
  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  RecaptchaVerifier,
  signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  query,
  where,
  limit,
  getDocs,
  addDoc,
  serverTimestamp,
  orderBy,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCyJm-IA8FwtVGLkavbv5HxHhwUAgVs5DU",
  authDomain: "saath-app-84a2e.firebaseapp.com",
  projectId: "saath-app-84a2e",
  storageBucket: "saath-app-84a2e.firebasestorage.app",
  messagingSenderId: "160313745704",
  appId: "1:160313745704:web:ac80a3d570b3913620701d",
  measurementId: "G-BLE9RVDPX1"
};
const isConfigured = () => Boolean(firebaseConfig.apiKey && firebaseConfig.projectId);

const screen = document.getElementById("screen");
const logoutBtn = document.getElementById("logoutBtn");
const configBanner = document.getElementById("configBanner");

const state = {
  user: null,
  profile: null,
  tab: "discover",
  deck: [],
  sent: new Set(),
  blocked: new Set(),
  chatUnsub: null
};

let auth = null;
let db = null;
let confirmation = null;

if (!isConfigured()) configBanner.classList.remove("hidden");

if (isConfigured()) {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  getRedirectResult(auth).catch((err) => {
    console.error(err);
  });
  onAuthStateChanged(auth, async (user) => {
    state.user = user;
    logoutBtn.classList.toggle("hidden", !user);
    if (!user) {
      stopChat();
      renderAuth();
      return;
    }
    const snap = await getDoc(doc(db, "users", user.uid));
    state.profile = snap.exists() ? snap.data() : null;
    if (!state.profile) renderProfileForm();
    else renderApp();
  });
} else {
  renderAuth();
}

logoutBtn.addEventListener("click", () => auth && signOut(auth));
const themeBtn = document.getElementById("themeBtn");
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  if (themeBtn) {
    themeBtn.textContent = theme === "light" ? "☾" : "☀";
    themeBtn.title = theme === "light" ? "Dark mode" : "Light mode";
  }
}
applyTheme(localStorage.getItem("saath-theme") || "dark");
themeBtn?.addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  localStorage.setItem("saath-theme", next);
  applyTheme(next);
});

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function pairId(a, b) {
  return a < b ? `${a}_${b}` : `${b}_${a}`;
}

function initial(name) {
  return escapeHtml((name || "?").trim().charAt(0).toUpperCase());
}

function stopChat() {
  if (state.chatUnsub) {
    state.chatUnsub();
    state.chatUnsub = null;
  }
}

function renderAuth(mode = "login") {
  stopChat();
  const title = mode === "login" ? "Wapas aao" : "Naya account";
  screen.innerHTML = `
    <div class="card">
      <h1>Saath</h1>
      <p class="muted">Google se login. 18+ . Email profile pe nahi dikhega. Phone login baad mein add hoga.</p>
      <button class="btn" id="googleBtn" type="button">Google se continue</button>
      <p class="error" id="formError"></p>
    </div>`;
  document.getElementById("googleBtn").onclick = googleLogin;
}

function setupRecaptcha() {
  if (window.saathRecaptcha) {
    window.saathRecaptcha.clear();
  }
  window.saathRecaptcha = new RecaptchaVerifier(auth, "recaptcha", { size: "normal" });
}

async function googleLogin() {
  const error = document.getElementById("formError");
  if (!isConfigured()) {
    error.textContent = "Pehle js/config.js mein Firebase config daalo.";
    return;
  }
  try {
    await signInWithRedirect(auth, new GoogleAuthProvider());
  } catch (err) {
    error.textContent = friendlyAuthError(err);
  }
}

async function sendOtp(event) {
  event.preventDefault();
  const error = document.getElementById("formError");
  if (!isConfigured()) {
    error.textContent = "Pehle js/config.js mein Firebase config daalo.";
    return;
  }
  const phone = String(new FormData(event.target).get("phone")).replace(/\D/g, "");
  try {
    confirmation = await signInWithPhoneNumber(auth, `+91${phone}`, window.saathRecaptcha);
    document.getElementById("otpForm").classList.remove("hidden");
    error.textContent = "OTP bhej diya.";
  } catch (err) {
    error.textContent = friendlyAuthError(err);
    setupRecaptcha();
  }
}

async function verifyOtp(event) {
  event.preventDefault();
  const error = document.getElementById("formError");
  try {
    await confirmation.confirm(String(new FormData(event.target).get("code")).trim());
  } catch (err) {
    error.textContent = friendlyAuthError(err);
  }
}

function friendlyAuthError(err) {
  if (err.code === "auth/invalid-credential") return "Email ya password galat hai.";
  if (err.code === "auth/billing-not-enabled" || err.code === "auth/operation-not-allowed") {
    return "Phone SMS Spark pe nahi chalta. Console mein Phone on karne ke liye Blaze chahiye. Google abhi chalega.";
  }
  if (err.code === "auth/invalid-phone-number") return "Number 10 digit ka hona chahiye.";
  if (err.code === "auth/invalid-verification-code") return "OTP galat hai.";
  return err.message;
}

function renderProfileForm() {
  const p = state.profile || {};
  const editing = Boolean(state.profile);
  const formMarkup = `
    <div class="card">
      <h1>${p.displayName ? "Profile edit" : "Apni profile"}</h1>
      <p class="muted">Sirf 18+ . Naam, age aur city dusre users ko dikhegi. Email nahi.</p>
      <form id="profileForm">
        <label>Naam</label>
        <input name="displayName" required minlength="2" maxlength="40" value="${escapeHtml(p.displayName || "")}" />
        <div class="row">
          <div>
            <label>Age</label>
            <input name="age" type="number" min="18" max="80" required value="${p.age || 21}" />
          </div>
          <div>
            <label>City</label>
            <input name="city" maxlength="40" required value="${escapeHtml(p.city || "")}" />
          </div>
        </div>
        <label>Main hoon</label>
        <select name="gender">
          ${["woman", "man", "other"].map((g) => `<option ${p.gender === g ? "selected" : ""}>${g}</option>`).join("")}
        </select>
        <label>Dekh raha/rahi hoon</label>
        <select name="lookingFor">
          ${["women", "men", "everyone"].map((g) => `<option ${p.lookingFor === g ? "selected" : ""}>${g}</option>`).join("")}
        </select>
        <label>Bio</label>
        <textarea name="bio" maxlength="300" required>${escapeHtml(p.bio || "")}</textarea>
        <div class="row form-actions">
          ${editing ? '<button class="btn ghost" id="cancelEdit" type="button">Cancel</button>' : ''}
          <button class="btn" type="submit">Save</button>
        </div>
        <p class="error" id="formError"></p>
      </form>
    </div>`;
  if (editing) {
    const old = document.getElementById("profileModal");
    if (old) old.remove();
    const modal = document.createElement("div");
    modal.id = "profileModal";
    modal.className = "modal-backdrop";
    modal.innerHTML = `<div class="modal-card"><div class="modal-heading"><strong>Edit profile</strong><button class="icon-btn" id="closeEdit" type="button" aria-label="Close">×</button></div>${formMarkup}</div>`;
    document.getElementById("app").appendChild(modal);
    modal.querySelector("#closeEdit").onclick = () => modal.remove();
    modal.querySelector("#cancelEdit").onclick = () => modal.remove();
  } else {
    screen.innerHTML = formMarkup;
  }
  const profileForm = document.getElementById("profileForm");
  profileForm.onsubmit = async (event) => {
    event.preventDefault();
    const data = new FormData(event.target);
    const age = Number(data.get("age"));
    if (age < 18 || age > 80) {
      profileForm.querySelector("#formError").textContent = "Age 18 se 80 ke beech honi chahiye.";
      return;
    }
    const profile = {
      uid: state.user.uid,
      displayName: String(data.get("displayName")).trim(),
      age,
      city: String(data.get("city")).trim(),
      gender: data.get("gender"),
      lookingFor: data.get("lookingFor"),
      bio: String(data.get("bio")).trim(),
      updatedAt: serverTimestamp()
    };
    await setDoc(doc(db, "users", state.user.uid), profile, { merge: true });
    state.profile = profile;
    if (editing) {
      document.getElementById("profileModal")?.remove();
      renderApp();
    } else {
      renderApp();
    }
  };
}

async function loadDeck() {
  const sentSnap = await getDocs(query(collection(db, "likes"), where("from", "==", state.user.uid), limit(50)));
  state.sent = new Set(sentSnap.docs.map((d) => d.data().to));
  const blockSnap = await getDocs(query(collection(db, "blocks"), where("from", "==", state.user.uid), limit(50)));
  state.blocked = new Set(blockSnap.docs.map((d) => d.data().to));
  const people = await getDocs(query(collection(db, "users"), limit(30)));
  state.deck = people.docs
    .map((d) => d.data())
    .filter((p) => p.uid !== state.user.uid && !state.sent.has(p.uid) && !state.blocked.has(p.uid));
}

async function renderApp() {
  stopChat();
  logoutBtn.classList.remove("hidden");
  if (state.tab === "discover") await loadDeck();
  screen.innerHTML = `
    <nav class="tabs">
      <button class="tab ${state.tab === "discover" ? "active" : ""}" data-tab="discover">Discover</button>
      <button class="tab ${state.tab === "matches" ? "active" : ""}" data-tab="matches">Matches</button>
      <button class="tab ${state.tab === "me" ? "active" : ""}" data-tab="me">Me</button>
    </nav>
    <div id="panel"></div>`;
  screen.querySelectorAll(".tab").forEach((btn) => {
    btn.onclick = () => {
      state.tab = btn.dataset.tab;
      renderApp();
    };
  });
  if (state.tab === "discover") renderDiscover();
  if (state.tab === "matches") renderMatches();
  if (state.tab === "me") renderMe();
}

function renderDiscover() {
  const panel = document.getElementById("panel");
  const person = state.deck[0];
  if (!person) {
    panel.innerHTML = `<div class="card empty"><h2>Abhi koi naya profile nahi</h2><p>Doosra account bana ke try karo, ya baad mein wapas aao. Free plan pe ek baar mein 30 profiles tak load hote hain.</p></div>`;
    return;
  }
  panel.innerHTML = `
    <article class="person">
      <div class="avatar">${initial(person.displayName)}</div>
      <div class="meta">
        <h2>${escapeHtml(person.displayName)}, ${person.age}</h2>
        <p class="muted">${escapeHtml(person.city)} · ${escapeHtml(person.gender)}</p>
        <p>${escapeHtml(person.bio)}</p>
        <div class="chips"><span class="chip">looking for ${escapeHtml(person.lookingFor)}</span></div>
      </div>
    </article>
    <div class="actions">
      <button class="btn pass" id="passBtn" type="button">Pass</button>
      <button class="btn" id="likeBtn" type="button">Like</button>
    </div>
    <button class="btn ghost" id="blockBtn" type="button">Block / report</button>
    <p class="error" id="formError"></p>`;
  document.getElementById("passBtn").onclick = () => {
    state.deck.shift();
    renderDiscover();
  };
  document.getElementById("likeBtn").onclick = () => likePerson(person);
  document.getElementById("blockBtn").onclick = () => blockPerson(person);
}

async function likePerson(person) {
  const error = document.getElementById("formError");
  try {
    await setDoc(doc(db, "likes", `${state.user.uid}_${person.uid}`), {
      from: state.user.uid,
      to: person.uid,
      createdAt: serverTimestamp()
    });
    const back = await getDoc(doc(db, "likes", `${person.uid}_${state.user.uid}`));
    if (back.exists()) {
      await setDoc(doc(db, "matches", pairId(state.user.uid, person.uid)), {
        members: [state.user.uid, person.uid].sort(),
        names: {
          [state.user.uid]: state.profile.displayName,
          [person.uid]: person.displayName
        },
        createdAt: serverTimestamp()
      });
      error.textContent = "Match ho gaya. Matches tab kholo.";
    }
    state.deck.shift();
    setTimeout(renderDiscover, 500);
  } catch (err) {
    error.textContent = err.message;
  }
}

async function blockPerson(person) {
  const reason = window.prompt("Report reason (optional):", "uncomfortable") || "blocked";
  await setDoc(doc(db, "blocks", `${state.user.uid}_${person.uid}`), {
    from: state.user.uid,
    to: person.uid,
    createdAt: serverTimestamp()
  });
  await addDoc(collection(db, "reports"), {
    from: state.user.uid,
    target: person.uid,
    reason: reason.slice(0, 200),
    createdAt: serverTimestamp()
  });
  state.deck.shift();
  renderDiscover();
}

async function renderMatches() {
  const panel = document.getElementById("panel");
  const snap = await getDocs(query(collection(db, "matches"), where("members", "array-contains", state.user.uid), limit(30)));
  if (snap.empty) {
    panel.innerHTML = `<div class="card empty"><h2>Abhi koi match nahi</h2><p>Jab dono taraf like hoga, yahan chat khulegi.</p></div>`;
    return;
  }
  panel.innerHTML = `<div class="list matches-list">${snap.docs.map((d) => {
    const data = d.data();
    const other = data.members.find((id) => id !== state.user.uid);
    const name = data.names?.[other] || "Match";
    return `<button class="item" data-id="${d.id}" data-name="${escapeHtml(name)}"><div class="dot">${initial(name)}</div><div class="grow"><strong>${escapeHtml(name)}</strong><span>Chat kholo</span></div></button>`;
  }).join("")}</div>`;
  panel.querySelectorAll(".item").forEach((btn) => {
    btn.onclick = () => openChat(btn.dataset.id, btn.dataset.name);
  });
}

function openChat(matchId, name) {
  stopChat();
  const panel = document.getElementById("panel");
  panel.innerHTML = `
    <div class="topbar">
      <button class="icon-btn" id="backBtn" type="button">←</button>
      <strong>${escapeHtml(name)}</strong>
    </div>
    <div class="chat-log" id="log"></div>
    <form id="chatForm" class="row chat-form">
      <input name="text" maxlength="500" placeholder="Message..." required />
      <button class="btn chat-send" type="submit">Send</button>
    </form>
    <p class="error" id="formError"></p>`;
  document.getElementById("backBtn").onclick = () => renderApp();
  const q = query(collection(db, "matches", matchId, "messages"), orderBy("createdAt", "asc"), limit(50));
  state.chatUnsub = onSnapshot(q, (snap) => {
    document.getElementById("log").innerHTML = snap.docs.map((d) => {
      const msg = d.data();
      return `<div class="bubble ${msg.from === state.user.uid ? "mine" : ""}">${escapeHtml(msg.text)}</div>`;
    }).join("") || `<p class="muted">Pehla message bhejo.</p>`;
    const log = document.getElementById("log");
    log.scrollTop = log.scrollHeight;
  }, (err) => {
    document.getElementById("formError").textContent = err.message;
  });
  document.getElementById("chatForm").onsubmit = async (event) => {
    event.preventDefault();
    const input = event.target.text;
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    try {
      await addDoc(collection(db, "matches", matchId, "messages"), {
        from: state.user.uid,
        text: text.slice(0, 500),
        createdAt: serverTimestamp()
      });
    } catch (err) {
      document.getElementById("formError").textContent = err.message;
    }
  };
}

function renderMe() {
  const p = state.profile;
  document.getElementById("panel").innerHTML = `
    <div class="card">
      <div class="profile-heading"><div class="dot" style="width:64px;height:64px;font-size:1.4rem">${initial(p.displayName)}</div><button class="icon-btn edit-pencil" id="editBtn" type="button" aria-label="Edit profile" title="Edit profile">✎</button></div>
      <h2>${escapeHtml(p.displayName)}, ${p.age}</h2>
      <p class="muted">${escapeHtml(p.city)} · ${escapeHtml(p.gender)} · looking for ${escapeHtml(p.lookingFor)}</p>
      <p>${escapeHtml(p.bio)}</p>
      <p class="tiny">Ye personal demo hai, public dating product nahi. Kisi ko phone number, address ya payment mat bhejna.</p>
    </div>`;
  document.getElementById("editBtn").onclick = () => renderProfileForm();
}
