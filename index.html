<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Saath</title>
  <style>
    :root { --bg:#0c0b0d; --card:#17151a; --elev:#221f26; --line:#2e2a33; --text:#f6f1ea; --muted:#a39aa8; --accent:#e25b6a; --shadow:0 18px 40px rgba(0,0,0,.35); font-family:"Segoe UI","Noto Sans",sans-serif; }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--text); }
    button, input, textarea, select { font:inherit; color:inherit; }
    button { cursor:pointer; }
    .app { min-height:100%; max-width:480px; margin:0 auto; padding:18px 16px 28px; }
    .brand { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .logo { font-weight:750; letter-spacing:-.04em; font-size:1.35rem; }
    .logo span { color:var(--accent); }
    .muted { color:var(--muted); font-size:.92rem; line-height:1.45; }
    .tiny { color:var(--muted); font-size:.78rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:18px; box-shadow:var(--shadow); }
    h1, h2 { margin:0 0 8px; letter-spacing:-.03em; }
    h1 { font-size:1.7rem; } h2 { font-size:1.2rem; }
    label { display:block; margin:12px 0 6px; font-size:.82rem; color:var(--muted); }
    input, textarea, select { width:100%; background:var(--elev); border:1px solid var(--line); border-radius:14px; padding:12px 13px; outline:none; }
    textarea { min-height:90px; resize:vertical; }
    .row { display:flex; gap:10px; } .row > * { flex:1; }
    .btn { border:0; border-radius:999px; padding:12px 16px; background:linear-gradient(135deg,var(--accent),#c44762); color:#fff; font-weight:700; width:100%; margin-top:14px; }
    .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
    .btn.danger { background:transparent; border:1px solid #6a3030; color:#ffb4b4; }
    .btn.pass { background:var(--elev); border:1px solid var(--line); }
    .btn.block { background:transparent; border:1px solid #6a3030; color:#ffb4b4; }
    .tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:8px 0 16px; }
    .tab { background:var(--elev); border:1px solid var(--line); border-radius:14px; padding:10px 6px; color:var(--muted); }
    .tab.active { color:#fff; border-color:#6d3d48; background:#2a1c22; }
    .count { display:inline-block; min-width:16px; margin-left:5px; padding:1px 6px; border-radius:999px; background:rgba(246,241,234,.18); color:var(--text); font-size:.68rem; line-height:1.4; vertical-align:1px; }
    .person { border-radius:26px; overflow:hidden; background:var(--elev); border:1px solid var(--line); min-height:420px; display:flex; flex-direction:column; justify-content:flex-end; position:relative; }
    .avatar { position:absolute; inset:0; display:grid; place-items:center; font-size:5rem; font-weight:750; background:radial-gradient(circle at 30% 20%, rgba(226,91,106,.45), transparent 40%), linear-gradient(160deg,#3a2430,#17151a 70%); }
    .person .meta { position:relative; padding:16px; background:linear-gradient(transparent, rgba(8,7,9,.92) 30%); }
    .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .chip { font-size:.75rem; padding:4px 8px; border-radius:999px; background:rgba(255,255,255,.08); }
    .actions { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px; }
    .list { display:flex; flex-direction:column; gap:10px; }
    .item { display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px; text-align:left; width:100%; }
    .dot { width:46px; height:46px; border-radius:50%; display:grid; place-items:center; background:#3a2430; font-weight:750; flex:none; }
    .grow { flex:1; min-width:0; }
    .item strong, .item span { display:block; }
    .item span { color:var(--muted); font-size:.82rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chat-log { height:52vh; overflow:auto; display:flex; flex-direction:column; gap:8px; padding:4px 0 10px; }
    .bubble { max-width:80%; padding:10px 12px; border-radius:16px; background:var(--elev); border:1px solid var(--line); }
    .bubble.mine { margin-left:auto; background:#4a2430; }
    .error { color:#ffb4b4; font-size:.86rem; min-height:1.1em; margin-top:8px; }
    .empty { text-align:center; padding:28px 10px; color:var(--muted); }
    .topbar { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
    .icon-btn { width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--elev); }
    .unread { width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none; animation:blink 1s infinite; }
    @keyframes blink { 50% { opacity:.15; } }
    .hidden { display:none !important; }
    .loading { text-align:center; padding:48px 10px; color:var(--muted); }
    .filter-bar { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
    .filter-toggle { flex:none; width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--elev); display:grid; place-items:center; font-size:1.1rem; color:var(--text); }
    .filter-toggle.active { background:#2a1c22; border-color:#6d3d48; color:var(--accent); }
    .filter-scroll { flex:1; overflow-x:auto; overflow-y:hidden; display:flex; gap:8px; padding-bottom:4px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    .filter-scroll::-webkit-scrollbar { display:none; }
    .filter-chip { flex:none; font-size:.78rem; padding:8px 12px; border-radius:999px; background:var(--elev); border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
    .filter-chip.on { background:#2a1c22; border-color:#6d3d48; color:var(--text); }
    .filter-chip.placeholder { border-style:dashed; opacity:.7; }
  </style>
</head>
<body>
  <main class="app">
    <header class="brand">
      <div class="logo">Saa<span>th</span></div>
    </header>
    <section id="screen"><div class="loading">Khol raha hai...</div></section>
  </main>
  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, query, where, limit, getDocs, addDoc, serverTimestamp, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCyJm-IA8FwtVGLkavbv5HxHhwUAgVs5DU",
  authDomain: "saath-app-84a2e.firebaseapp.com",
  projectId: "saath-app-84a2e",
  storageBucket: "saath-app-84a2e.firebasestorage.app",
  messagingSenderId: "160313745704",
  appId: "1:160313745704:web:ac80a3d570b3913620701d"
};

const screen = document.getElementById("screen");
const state = { user:null, profile:null, tab:"discover", deck:[], allDeck:[], sent:new Set(), blocked:new Set(), chatUnsub:null, deckReady:false, matchesReady:false, filters:{ minAge:null, maxAge:null, gender:"", state:"", city:"" }, showFilterForm:false };

// Catch JS errors so page is not blank
window.onerror = function(msg, src, line) {
  try {
    screen.innerHTML = '<div class="card"><h2>JS Error</h2><p class="error">' + String(msg).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</p><p class="tiny">' + (src||'') + ' : ' + line + '</p></div>';
  } catch(e) {}
  return false;
};
window.addEventListener("unhandledrejection", function(ev) {
  try {
    const r = ev.reason;
    screen.innerHTML = '<div class="card"><h2>Promise Error</h2><p class="error">' + String(r && r.message || r).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</p></div>';
  } catch(e) {}
});

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

setPersistence(auth, browserLocalPersistence).finally(() => {
  onAuthStateChanged(auth, async (user) => {
    try {
      state.user = user;
      if (!user) { stopChat(); state.deckReady = false; state.matchesReady = false; renderAuth(); return; }
      const snap = await getDoc(doc(db, "users", user.uid));
      state.profile = snap.exists() ? snap.data() : null;
      if (!state.profile) renderProfileForm();
      else renderApp();
    } catch (err) {
      screen.innerHTML = '<div class="card"><h2>Auth Error</h2><p class="error">' + escapeHtml(err.message || String(err)) + '</p></div>';
    }
  });
});

function showBootError(err) {
  const box = document.getElementById("formError");
  if (box) box.textContent = err.message;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"]/g, (ch) => ({
    "&": "\u0026amp;",
    "<": "\u0026lt;",
    ">": "\u0026gt;",
    '"': "\u0026quot;"
  })[ch]);
}
function pairId(a, b) { return a < b ? a + "_" + b : b + "_" + a; }
const PLACES = {
  "Andhra Pradesh": ["Visakhapatnam", "Vijayawada", "Guntur", "Nellore", "Kurnool", "Tirupati", "Rajahmundry", "Kadapa", "Anantapur", "Eluru", "Ongole", "Chittoor"],
  "Arunachal Pradesh": ["Itanagar", "Tawang", "Pasighat", "Ziro", "Bomdila"],
  "Assam": ["Guwahati", "Silchar", "Dibrugarh", "Jorhat", "Nagaon", "Tezpur"],
  "Bihar": ["Patna", "Gaya", "Bhagalpur", "Muzaffarpur", "Darbhanga", "Purnia", "Begusarai"],
  "Chhattisgarh": ["Raipur", "Bhilai", "Bilaspur", "Korba", "Durg", "Rajnandgaon"],
  "Goa": ["Panaji", "Margao", "Vasco da Gama", "Mapusa"],
  "Gujarat": ["Ahmedabad", "Surat", "Vadodara", "Rajkot", "Bhavnagar", "Jamnagar", "Gandhinagar"],
  "Haryana": ["Gurugram", "Faridabad", "Panipat", "Ambala", "Karnal", "Hisar", "Rohtak", "Sonipat"],
  "Himachal Pradesh": ["Shimla", "Manali", "Dharamshala", "Solan", "Mandi", "Kullu"],
  "Jharkhand": ["Ranchi", "Jamshedpur", "Dhanbad", "Bokaro", "Hazaribagh"],
  "Karnataka": ["Bengaluru", "Mysuru", "Mangaluru", "Hubballi", "Belagavi", "Davangere", "Ballari", "Shivamogga"],
  "Kerala": ["Thiruvananthapuram", "Kochi", "Kozhikode", "Thrissur", "Kollam", "Kannur", "Alappuzha"],
  "Madhya Pradesh": ["Bhopal", "Indore", "Gwalior", "Jabalpur", "Ujjain", "Sagar", "Rewa"],
  "Maharashtra": ["Mumbai", "Pune", "Nagpur", "Nashik", "Thane", "Aurangabad", "Solapur", "Kolhapur"],
  "Manipur": ["Imphal", "Thoubal", "Churachandpur"],
  "Meghalaya": ["Shillong", "Tura"],
  "Mizoram": ["Aizawl", "Lunglei"],
  "Nagaland": ["Kohima", "Dimapur"],
  "Odisha": ["Bhubaneswar", "Cuttack", "Rourkela", "Puri", "Sambalpur", "Berhampur"],
  "Punjab": ["Ludhiana", "Amritsar", "Jalandhar", "Patiala", "Bathinda", "Mohali"],
  "Rajasthan": ["Jaipur", "Jodhpur", "Udaipur", "Kota", "Ajmer", "Bikaner", "Bhilwara"],
  "Sikkim": ["Gangtok", "Namchi"],
  "Tamil Nadu": ["Chennai", "Coimbatore", "Madurai", "Tiruchirappalli", "Salem", "Tirunelveli", "Erode", "Vellore"],
  "Telangana": ["Hyderabad", "Warangal", "Nizamabad", "Karimnagar", "Khammam"],
  "Tripura": ["Agartala"],
  "Uttar Pradesh": ["Lucknow", "Kanpur", "Varanasi", "Agra", "Noida", "Ghaziabad", "Prayagraj", "Meerut", "Bareilly", "Aligarh", "Gorakhpur"],
  "Uttarakhand": ["Dehradun", "Haridwar", "Nainital", "Rishikesh", "Haldwani"],
  "West Bengal": ["Kolkata", "Howrah", "Durgapur", "Asansol", "Siliguri", "Darjeeling"],
  "Andaman and Nicobar": ["Port Blair"],
  "Chandigarh": ["Chandigarh"],
  "Dadra and Nagar Haveli and Daman and Diu": ["Daman", "Silvassa"],
  "Delhi": ["New Delhi", "Delhi"],
  "Jammu and Kashmir": ["Srinagar", "Jammu"],
  "Ladakh": ["Leh", "Kargil"],
  "Lakshadweep": ["Kavaratti"],
  "Puducherry": ["Puducherry", "Karaikal"]
};
function fillCities(stateName, selected) {
  const city = document.querySelector("#profileForm select[name=city]");
  const list = PLACES[stateName] || [];
  city.innerHTML = '<option value="">City chuno</option>' + list.map((c) => '<option' + (c === selected ? " selected" : "") + ">" + c + "</option>").join("");
  city.disabled = !list.length;
}
function initial(name) { return escapeHtml((name || "?").trim().charAt(0).toUpperCase()); }
function stopChat() { if (state.chatUnsub) { state.chatUnsub(); state.chatUnsub = null; } }
function seenKey(matchId) { return "saath-seen-" + state.user.uid + "-" + matchId; }
function countSeenKey() { return "saath-count-seen-" + state.user.uid; }
function countAlreadySeen() { return localStorage.getItem(countSeenKey()) === "1"; }
function markCountSeen() { localStorage.setItem(countSeenKey(), "1"); }
function markSeen(matchId) { localStorage.setItem(seenKey(matchId), String(Date.now())); }
async function hasNewMessage(matchId) {
  const latest = await getDocs(query(collection(db, "matches", matchId, "messages"), orderBy("createdAt", "desc"), limit(1)));
  if (latest.empty) return false;
  const msg = latest.docs[0].data();
  if (msg.from === state.user.uid || !msg.createdAt) return false;
  const seen = Number(localStorage.getItem(seenKey(matchId)) || 0);
  return msg.createdAt.toMillis() > seen;
}

function renderAuth() {
  stopChat();
  screen.innerHTML = '<div class="card"><h1>Saath</h1><p class="muted">Google se login. 18+ . Email profile pe nahi dikhega.</p><button class="btn" id="googleBtn" type="button">Google se continue</button><p class="error" id="formError"></p></div>';
  document.getElementById("googleBtn").onclick = async () => {
    const error = document.getElementById("formError");
    document.getElementById("googleBtn").disabled = true;
    error.textContent = "Google khul raha hai...";
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (err) { error.textContent = err.code + ": " + err.message; document.getElementById("googleBtn").disabled = false; }
  };
}

function renderProfileForm() {
  const p = state.profile || {};
  const stateOptions = Object.keys(PLACES).map((name) => '<option' + (name === p.state ? " selected" : "") + ">" + name + "</option>").join("");
  screen.innerHTML = '<div class="card"><h1>' + (p.displayName ? "Profile edit" : "Apni profile") + '</h1><p class="muted">Sirf 18+ . Naam, age, state aur city dusre users ko dikhegi.</p><form id="profileForm"><label>Naam</label><input name="displayName" required minlength="2" maxlength="40" value="' + escapeHtml(p.displayName || "") + '"><div class="row"><div><label>Age</label><input name="age" type="number" min="18" max="80" required value="' + (p.age || 21) + '"></div><div><label>State</label><select name="state" required><option value="">State chuno</option>' + stateOptions + '</select></div></div><label>City</label><select name="city" required disabled><option value="">Pehle state chuno</option></select><label>Main hoon</label><select name="gender"><option>woman</option><option>man</option><option>other</option></select><label>Dekh raha/rahi hoon</label><select name="lookingFor"><option>women</option><option>men</option><option>everyone</option></select><label>Bio</label><textarea name="bio" maxlength="300" required>' + escapeHtml(p.bio || "") + '</textarea><button class="btn" type="submit">Save</button><p class="error" id="formError"></p></form></div>';
  const form = document.getElementById("profileForm");
  if (p.gender) form.gender.value = p.gender;
  if (p.lookingFor) form.lookingFor.value = p.lookingFor;
  if (p.state) fillCities(p.state, p.city);
  form.state.onchange = () => fillCities(form.state.value, "");
  form.onsubmit = async (event) => {
    event.preventDefault();
    const data = new FormData(event.target);
    const age = Number(data.get("age"));
    if (age < 18 || age > 80) { document.getElementById("formError").textContent = "Age 18 se 80 ke beech honi chahiye."; return; }
    if (!data.get("state") || !data.get("city")) { document.getElementById("formError").textContent = "State aur city dono chuno."; return; }
    const profile = { uid: state.user.uid, displayName: String(data.get("displayName")).trim(), age, state: data.get("state"), city: data.get("city"), gender: data.get("gender"), lookingFor: data.get("lookingFor"), bio: String(data.get("bio")).trim(), updatedAt: serverTimestamp() };
    try {
      await setDoc(doc(db, "users", state.user.uid), profile, { merge: true });
      state.profile = profile;
      renderApp();
    } catch (err) { document.getElementById("formError").textContent = err.message; }
  };
}

function hasActiveFilters() {
  const f = state.filters;
  return !!(f.minAge || f.maxAge || f.gender || f.state || f.city);
}
function applyFilters() {
  const f = state.filters;
  state.deck = state.allDeck.filter((p) => {
    if (f.minAge && Number(p.age) < f.minAge) return false;
    if (f.maxAge && Number(p.age) > f.maxAge) return false;
    if (f.gender && p.gender !== f.gender) return false;
    if (f.state && p.state !== f.state) return false;
    if (f.city && p.city !== f.city) return false;
    return true;
  });
}
function clearFilters() {
  state.filters = { minAge:null, maxAge:null, gender:"", state:"", city:"" };
  state.showFilterForm = false;
  applyFilters();
}
async function loadDeck() {
  const sentSnap = await getDocs(query(collection(db, "likes"), where("from", "==", state.user.uid), limit(50)));
  state.sent = new Set(sentSnap.docs.map((d) => d.data().to));
  const blockSnap = await getDocs(query(collection(db, "blocks"), where("from", "==", state.user.uid), limit(50)));
  state.blocked = new Set(blockSnap.docs.map((d) => d.data().to));
  const people = await getDocs(query(collection(db, "users"), limit(30)));
  state.allDeck = people.docs.map((d) => ({ ...d.data(), uid: d.data().uid || d.id })).filter((p) => p.uid !== state.user.uid && !state.sent.has(p.uid) && !state.blocked.has(p.uid));
  applyFilters();
  state.deckReady = true;
}

async function renderApp() {
  stopChat();
  const panelReady = state.deckReady || state.tab !== "discover";
  if (!panelReady) screen.innerHTML = '<div class="loading">Load ho raha hai...</div>';
  if (state.tab === "discover" && !state.deckReady) await loadDeck();
  if (!state.matchesReady) {
    const matchSnap = await getDocs(query(collection(db, "matches"), where("members", "array-contains", state.user.uid), limit(30)));
    state.matches = matchSnap.docs;
    state.matchesReady = true;
  }
  const count = (state.matches || []).length;
  const showCount = count > 0 && !countAlreadySeen();
  screen.innerHTML = '<nav class="tabs"><button class="tab" data-tab="discover">Discover</button><button class="tab" data-tab="matches">Matches' + (showCount ? ' <span class="count">' + count + '</span>' : '') + '</button><button class="tab" data-tab="me">Me</button></nav><div id="panel"></div>';
  screen.querySelectorAll(".tab").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.tab === state.tab);
    btn.onclick = () => { if (btn.dataset.tab !== "discover") state.showFilterForm = false; state.tab = btn.dataset.tab; renderApp(); };
  });
  if (state.tab === "discover") renderDiscover();
  if (state.tab === "matches") renderMatches();
  if (state.tab === "me") renderMe();
}

function renderDiscover() {
  const panel = document.getElementById("panel");
  const f = state.filters;
  const active = hasActiveFilters();

  // Filter form screen
  if (state.showFilterForm) {
    const stateOptions = Object.keys(PLACES).map((name) => '<option value="' + escapeHtml(name) + '"' + (name === f.state ? " selected" : "") + ">" + escapeHtml(name) + "</option>").join("");
    panel.innerHTML = '<div class="card"><div class="topbar"><button class="icon-btn" id="filterBackBtn" type="button">&larr;</button><strong>Filters</strong></div>' +
      '<div class="row"><div><label>Min Age</label><input id="fMinAge" type="number" min="18" max="80" placeholder="18" value="' + (f.minAge || "") + '"></div>' +
      '<div><label>Max Age</label><input id="fMaxAge" type="number" min="18" max="80" placeholder="80" value="' + (f.maxAge || "") + '"></div></div>' +
      '<label>Gender</label><select id="fGender"><option value="">Koi bhi</option><option value="woman"' + (f.gender === "woman" ? " selected" : "") + '>Woman</option><option value="man"' + (f.gender === "man" ? " selected" : "") + '>Man</option><option value="other"' + (f.gender === "other" ? " selected" : "") + '>Other</option></select>' +
      '<label>State</label><select id="fState"><option value="">Koi bhi state</option>' + stateOptions + '</select>' +
      '<label>City</label><select id="fCity" ' + (f.state ? "" : "disabled") + '><option value="">' + (f.state ? "City chuno" : "Pehle state chuno") + '</option></select>' +
      '<button class="btn" id="applyFilterBtn" type="button">Apply filters</button>' +
      '<button class="btn ghost" id="clearFilterBtn" type="button" style="margin-top:8px">Clear all</button></div>';
    const citySelect = document.getElementById("fCity");
    if (f.state) {
      const list = PLACES[f.state] || [];
      citySelect.innerHTML = '<option value="">Koi bhi city</option>' + list.map((c) => '<option value="' + escapeHtml(c) + '"' + (c === f.city ? " selected" : "") + ">" + escapeHtml(c) + "</option>").join("");
      citySelect.disabled = false;
    }
    document.getElementById("fState").onchange = () => {
      const st = document.getElementById("fState").value;
      const list = PLACES[st] || [];
      citySelect.innerHTML = '<option value="">' + (st ? "Koi bhi city" : "Pehle state chuno") + '</option>' + list.map((c) => '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + "</option>").join("");
      citySelect.disabled = !st;
    };
    document.getElementById("filterBackBtn").onclick = () => { state.showFilterForm = false; renderDiscover(); };
    document.getElementById("clearFilterBtn").onclick = () => { clearFilters(); renderDiscover(); };
    document.getElementById("applyFilterBtn").onclick = () => {
      const minA = document.getElementById("fMinAge").value;
      const maxA = document.getElementById("fMaxAge").value;
      state.filters.minAge = minA ? Number(minA) : null;
      state.filters.maxAge = maxA ? Number(maxA) : null;
      state.filters.gender = document.getElementById("fGender").value || "";
      state.filters.state = document.getElementById("fState").value || "";
      state.filters.city = document.getElementById("fCity").value || "";
      if (state.filters.minAge && state.filters.maxAge && state.filters.minAge > state.filters.maxAge) {
        const t = state.filters.minAge; state.filters.minAge = state.filters.maxAge; state.filters.maxAge = t;
      }
      state.showFilterForm = false;
      applyFilters();
      renderDiscover();
    };
    return;
  }

  // Build filter chips
  let chipsHtml = "";
  if (f.minAge || f.maxAge) {
    const ageLabel = (f.minAge || "18") + "–" + (f.maxAge || "80");
    chipsHtml += '<span class="filter-chip on">Age ' + ageLabel + '</span>';
  } else {
    chipsHtml += '<span class="filter-chip placeholder">Age</span>';
  }
  if (f.gender) {
    chipsHtml += '<span class="filter-chip on">' + escapeHtml(f.gender) + '</span>';
  } else {
    chipsHtml += '<span class="filter-chip placeholder">Gender</span>';
  }
  if (f.state) {
    chipsHtml += '<span class="filter-chip on">' + escapeHtml(f.state) + (f.city ? " · " + escapeHtml(f.city) : "") + '</span>';
  } else {
    chipsHtml += '<span class="filter-chip placeholder">State / City</span>';
  }

  const filterBtnIcon = active ? "✕" : "🔍"; // filter icon / cross
  const filterBar = '<div class="filter-bar"><button class="filter-toggle' + (active ? " active" : "") + '" id="filterToggleBtn" type="button" title="' + (active ? "Clear filters" : "Open filters") + '">' + filterBtnIcon + '</button><div class="filter-scroll">' + chipsHtml + '</div></div>';

  const person = state.deck[0];
  if (!person) {
    panel.innerHTML = filterBar + '<div class="card empty"><h2>Koi profile nahi mila</h2><p>' + (active ? "Filters hata ke try karo ya doosra Google account se profile banao." : "Doosra Google account se profile banao.") + '</p></div>';
  } else {
    panel.innerHTML = filterBar +
      '<article class="person"><div class="avatar">' + initial(person.displayName) + '</div><div class="meta"><h2>' + escapeHtml(person.displayName) + ", " + person.age + '</h2><p class="muted">' + escapeHtml(person.city) + (person.state ? ", " + escapeHtml(person.state) : "") + " · " + escapeHtml(person.gender) + "</p><p>" + escapeHtml(person.bio) + '</p></div></article>' +
      '<div class="actions"><button class="btn pass" id="passBtn" type="button">Pass</button><button class="btn block" id="blockBtn" type="button">Block</button><button class="btn" id="likeBtn" type="button">Like</button></div><p class="error" id="formError"></p>';
    document.getElementById("passBtn").onclick = () => { state.deck.shift(); renderDiscover(); };
    document.getElementById("blockBtn").onclick = () => blockPerson(person.uid, person.displayName, "discover");
    document.getElementById("likeBtn").onclick = () => likePerson(person);
  }

  document.getElementById("filterToggleBtn").onclick = () => {
    if (active) {
      clearFilters();
      renderDiscover();
    } else {
      state.showFilterForm = true;
      renderDiscover();
    }
  };
}

async function blockPerson(targetUid, targetName, fromScreen, matchId) {
  if (!targetUid) return;
  if (!confirm((targetName || "Is user") + " ko block karna hai? Ye Discover mein nahi dikhega.")) return;
  try {
    await setDoc(doc(db, "blocks", state.user.uid + "_" + targetUid), {
      from: state.user.uid,
      to: targetUid,
      createdAt: serverTimestamp()
    });
    state.blocked.add(targetUid);
    state.allDeck = state.allDeck.filter((p) => p.uid !== targetUid);
    state.deck = state.deck.filter((p) => p.uid !== targetUid);
    if (matchId) {
      await deleteDoc(doc(db, "matches", matchId)).catch(() => {});
      state.matches = (state.matches || []).filter((d) => d.id !== matchId);
    } else {
      state.matchesReady = false;
    }
    if (fromScreen === "chat") {
      state.tab = "matches";
      renderApp();
    } else {
      renderDiscover();
    }
  } catch (err) {
    const box = document.getElementById("formError");
    if (box) box.textContent = err.message;
    else alert(err.message);
  }
}

async function likePerson(person) {
  const error = document.getElementById("formError");
  try {
    const likeRef = doc(db, "likes", state.user.uid + "_" + person.uid);
    const existing = await getDoc(likeRef);
    if (!existing.exists()) {
      await setDoc(likeRef, { from: state.user.uid, to: person.uid, createdAt: serverTimestamp() });
    }
    const back = await getDoc(doc(db, "likes", person.uid + "_" + state.user.uid));
    if (back.exists()) {
      await setDoc(doc(db, "matches", pairId(state.user.uid, person.uid)), { members: [state.user.uid, person.uid].sort(), names: { [state.user.uid]: state.profile.displayName, [person.uid]: person.displayName }, createdAt: serverTimestamp() });
      error.textContent = "Match ho gaya. Matches tab kholo.";
      state.matchesReady = false;
    }
    state.deck.shift();
    setTimeout(renderDiscover, 200);
  } catch (err) { error.textContent = err.message; }
}

async function renderMatches() {
  const panel = document.getElementById("panel");
  const docs = state.matches || [];
  const count = docs.length;
  const showCount = count > 0 && !countAlreadySeen();
  if (state.tab === "matches") markCountSeen();
  if (!count) { panel.innerHTML = '<div class="card empty"><h2>Abhi koi match nahi</h2><p>Jab dono taraf like hoga, yahan chat khulegi.</p></div>'; return; }
  panel.innerHTML = (showCount ? '<p class="tiny" style="margin:0 2px 10px">' + count + ' match hue</p>' : '') + '<div class="list">' + docs.map((d) => {
    const data = d.data();
    const other = data.members.find((id) => id !== state.user.uid);
    const name = (data.names && data.names[other]) || "Match";
    return '<button class="item" data-id="' + d.id + '" data-name="' + escapeHtml(name) + '"><div class="dot">' + initial(name) + '</div><div class="grow"><strong>' + escapeHtml(name) + '</strong><span>Chat kholo</span></div><span class="unread hidden" data-unread="' + d.id + '"></span></button>';
  }).join("") + "</div>";
  panel.querySelectorAll(".item").forEach((btn) => { btn.onclick = () => openChat(btn.dataset.id, btn.dataset.name); });
  docs.forEach(async (d) => {
    if (await hasNewMessage(d.id)) {
      const dot = panel.querySelector('[data-unread="' + d.id + '"]');
      if (dot) dot.classList.remove("hidden");
    }
  });
}

function openChat(matchId, name) {
  stopChat();
  markSeen(matchId);
  const panel = document.getElementById("panel");
  const matchDoc = (state.matches || []).find((d) => d.id === matchId);
  const otherUid = matchDoc ? matchDoc.data().members.find((id) => id !== state.user.uid) : null;
  panel.innerHTML = '<div class="topbar"><button class="icon-btn" id="backBtn" type="button">&larr;</button><strong style="flex:1">' + escapeHtml(name) + '</strong><button class="btn block" id="chatBlockBtn" type="button" style="width:auto;margin:0;padding:8px 12px">Block</button></div><div class="chat-log" id="log"></div><form id="chatForm" class="row"><input name="text" maxlength="500" placeholder="Message..." required><button class="btn" type="submit" style="width:auto;margin-top:0">Send</button></form><p class="error" id="formError"></p>';
  document.getElementById("backBtn").onclick = () => renderApp();
  document.getElementById("chatBlockBtn").onclick = () => blockPerson(otherUid, name, "chat", matchId);
  state.chatUnsub = onSnapshot(query(collection(db, "matches", matchId, "messages"), orderBy("createdAt", "asc"), limit(50)), (snap) => {
    markSeen(matchId);
    document.getElementById("log").innerHTML = snap.docs.map((d) => {
      const msg = d.data();
      return '<div class="bubble' + (msg.from === state.user.uid ? " mine" : "") + '">' + escapeHtml(msg.text) + "</div>";
    }).join("") || '<p class="muted">Pehla message bhejo.</p>';
    const log = document.getElementById("log");
    log.scrollTop = log.scrollHeight;
  }, (err) => { document.getElementById("formError").textContent = err.message; });
  document.getElementById("chatForm").onsubmit = async (event) => {
    event.preventDefault();
    const input = event.target.text;
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    try { await addDoc(collection(db, "matches", matchId, "messages"), { from: state.user.uid, text: text.slice(0, 500), createdAt: serverTimestamp() }); }
    catch (err) { document.getElementById("formError").textContent = err.message; }
  };
}

function renderMe() {
  const p = state.profile;
  document.getElementById("panel").innerHTML = '<div class="card"><div class="dot" style="width:64px;height:64px;font-size:1.4rem">' + initial(p.displayName) + "</div><h2>" + escapeHtml(p.displayName) + ", " + p.age + '</h2><p class="muted">' + escapeHtml(p.city) + (p.state ? ", " + escapeHtml(p.state) : "") + " · " + escapeHtml(p.gender) + " · looking for " + escapeHtml(p.lookingFor) + "</p><p>" + escapeHtml(p.bio) + '</p><button class="btn" id="editBtn" type="button">Edit profile</button><button class="btn ghost" id="logoutBtn" type="button">Logout</button><button class="btn danger" id="deleteBtn" type="button">Delete profile</button><p class="tiny">Delete se naam, city aur bio hat jayega. Login Google pe rahega.</p></div>';
  document.getElementById("editBtn").onclick = () => renderProfileForm();
  document.getElementById("logoutBtn").onclick = () => signOut(auth);
  document.getElementById("deleteBtn").onclick = deleteProfile;
}

async function deleteProfile() {
  if (!confirm("Profile delete karni hai? Ye wapas nahi aayegi.")) return;
  const uid = state.user.uid;
  const btn = document.getElementById("deleteBtn");
  btn.disabled = true;
  btn.textContent = "Delete ho raha hai...";
  try {
    const likes = await getDocs(query(collection(db, "likes"), where("from", "==", uid), limit(50)));
    await Promise.all(likes.docs.map((d) => deleteDoc(d.ref).catch(() => {})));
    const blocks = await getDocs(query(collection(db, "blocks"), where("from", "==", uid), limit(50)));
    await Promise.all(blocks.docs.map((d) => deleteDoc(d.ref).catch(() => {})));
    const matches = await getDocs(query(collection(db, "matches"), where("members", "array-contains", uid), limit(30)));
    for (const match of matches.docs) {
      const messages = await getDocs(query(collection(db, "matches", match.id, "messages"), limit(50)));
      await Promise.all(messages.docs.map((d) => deleteDoc(d.ref).catch(() => {})));
      await deleteDoc(match.ref).catch(() => {});
    }
    await deleteDoc(doc(db, "users", uid));
    state.profile = null;
    await signOut(auth);
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "Delete profile";
    alert(err.message);
  }
}
  </script>
