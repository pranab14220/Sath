name: Build Saath Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android

      - name: Configure Firebase Android app
        working-directory: mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing GitHub Actions secret GOOGLE_SERVICES_JSON"
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android/build.gradle')
          app = Path('android/app/build.gradle')
          rs = root.read_text()
          if 'com.google.gms:google-services' not in rs:
              rs = rs.replace("dependencies {", "dependencies {\\n        classpath 'com.google.gms:google-services:4.4.2'")
          root.write_text(rs)
          a = app.read_text()
          if "com.google.gms.google-services" not in a:
              a += "\\napply plugin: 'com.google.gms.google-services'\\n"
          app.write_text(a)
          PY

      - name: Add Android deep-link callback for Google sign-in
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          closing = '</activity>'
          deep_link = """    <intent-filter android:autoVerify="false">
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="com.saath.app" android:host="login-callback" />
              </intent-filter>
          """
          if 'android:host="login-callback"' not in s:
              if closing not in s:
                  raise SystemExit('Main activity closing tag not found')
              s = s.replace(closing, deep_link + closing, 1)
          p.write_text(s)
          PY

      - name: Sync web app into Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile
        run: cd android && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Saath-debug-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
