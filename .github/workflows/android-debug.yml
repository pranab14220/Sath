name: Build Saath Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android

      - name: Add Android deep-link callback for Google sign-in
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<activity'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('Main activity not found in AndroidManifest.xml')
          end = s.find('>', start)
          activity = s[start:end]
          if 'android.intent.action.VIEW' not in s:
              s = s[:end] + '''\n            <intent-filter android:autoVerify="false">\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="com.saath.app" android:host="login-callback" />\n            </intent-filter>''' + s[end:]
          p.write_text(s)
          PY

      - name: Sync web app into Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile
        run: cd android && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Saath-debug-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
